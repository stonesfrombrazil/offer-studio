<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polita Offer Studio — Teste</title><style>:root{font-family:system-ui,Arial;color:#ece9e1;background:#121817}*{box-sizing:border-box}body{margin:0}header{padding:20px 5%;border-bottom:1px solid #36433e;display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px;letter-spacing:2px}small,.muted{color:#aebbb2}main{max-width:1000px;margin:auto;padding:22px}h1{font-size:24px}h2{font-size:19px}.panel{background:#202925;border:1px solid #3b4842;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:16px;border-radius:12px;background:#303a34}.metric b{display:block;font-size:28px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#29342e;color:#f2eee4}.tabs button.active,button.primary{background:#cbb997;color:#18201b}button{font:inherit;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#3b4941;color:white}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;background:#111915;color:white;border:1px solid #536058;border-radius:8px;padding:11px;font:inherit;margin-top:5px}label{display:block;margin:12px 0;color:#d6d8d0;font-size:14px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>*{flex:1}.entry{padding:14px 0;border-bottom:1px solid #445149}.entry:last-child{border:0}.tag{border:1px solid #748177;border-radius:30px;padding:3px 8px;font-size:12px}.alert{color:#f0d9a8}.check{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;font:inherit;line-height:1.55;background:#111915;border-radius:10px;padding:16px}a{color:#dfcda6}@media(max-width:600px){.grid{grid-template-columns:1fr}.row{display:block}.row>*{margin:10px 0}header{align-items:flex-start}}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#121817"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Polita Studio"><link rel="apple-touch-icon" href="icon-180.png"><meta name="format-detection" content="telephone=no"><style>body{padding-bottom:env(safe-area-inset-bottom)}button,input,select,textarea{font-size:16px;min-height:44px}header{padding-top:calc(14px + env(safe-area-inset-top))}nav button{min-height:48px}@media(max-width:850px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;position:sticky;top:0;background:#121817;z-index:5;padding:8px 0;scrollbar-width:none}nav button{white-space:nowrap;flex-shrink:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}.panel{padding:16px}}@media(max-width:480px){header{padding-left:16px;padding-right:16px}header strong{font-size:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:12px}.metric b{font-size:23px}.row{flex-direction:column;align-items:stretch}.row>*{width:100%}.item{align-items:stretch;flex-direction:column}}@media(min-width:851px) and (max-width:1180px){.layout{grid-template-columns:175px 1fr}}@media(display-mode:standalone){main{padding-bottom:calc(24px + env(safe-area-inset-bottom))}}</style></head><body><header><div><strong>POLITA</strong> <small>/ OFFER STUDIO</small></div><span class="tag">MODO DEMONSTRAÇÃO</span></header><main><p class="alert">Ambiente de teste local: dados fictícios, sem login, sem banco de dados e sem disparo automático. Alterações são mantidas apenas nesta aba enquanto ela estiver aberta.</p><div class="grid"><div class="metric">Clientes<b id="countContacts">0</b></div><div class="metric">Ofertas<b id="countOffers">0</b></div><div class="metric">Campanhas<b id="countCampaigns">0</b></div></div><p id="notice" class="alert" role="status"></p><div class="tabs"><button data-tab="clients" class="active">Clientes</button><button data-tab="offers">Ofertas</button><button data-tab="campaigns">Campanhas</button><button data-tab="queue">Fila WhatsApp</button></div><div id="content"></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='clients',next=10;const contacts=[{id:1,name:'Comprador México (exemplo)',company:'Empresa demonstrativa MX',phone:'',language:'ES',consent:false},{id:2,name:'Buyer USA (sample)',company:'Sample Stone LLC',phone:'',language:'EN',consent:false}],offers=[{id:3,title:'Crystallo Polita — selección',material:'Crystallo Polita',block:'1007449',price:'',url:''}],campaigns=[];let campaignId=null;const notice=s=>$('notice').textContent=s;const btn=(name,action,disabled=false)=>`<button data-action="${action}" ${disabled?'disabled':''}>${name}</button>`;function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('countContacts').textContent=contacts.length;$('countOffers').textContent=offers.length;$('countCampaigns').textContent=campaigns.length;let h='';if(tab==='clients')h=`<section class="panel"><h2>Adicionar comprador de teste</h2><form id="addContact"><div class="row"><label>Nome<input name="name" required></label><label>Empresa<input name="company" required></label></div><div class="row"><label>WhatsApp com DDI<input name="phone" placeholder="Ex.: 5215512345678" required></label><label>Idioma<select name="language"><option>ES</option><option>EN</option><option>PT</option></select></label></div><label><input type="checkbox" class="check" name="consent" required> Confirme que o contato autorizou ofertas comerciais</label><button class="primary">Adicionar contato</button></form></section><section class="panel"><h2>Carteira</h2>${contacts.map(c=>`<div class="entry"><b>${escape(c.name)}</b> · ${escape(c.company)} <span class="tag">${c.language}</span><p class="muted">${escape(c.phone)||'Telefone não informado'} · ${c.consent?'Consentimento informado':'Exemplo sem consentimento'}</p></div>`).join('')}</section>`;if(tab==='offers')h=`<section class="panel"><h2>Criar oferta</h2><form id="addOffer"><label>Título<input name="title" required></label><div class="row"><label>Material<input name="material" value="Crystallo Polita" required></label><label>Bloco<input name="block" placeholder="1007449"></label></div><div class="row"><label>Preço USD/ft² (opcional)<input type="number" min="0" step="0.01" name="price"></label><label>Link do catálogo (opcional)<input type="url" name="url" placeholder="https://..."></label></div><button class="primary">Salvar oferta</button></form></section><section class="panel"><h2>Ofertas cadastradas</h2>${offers.map(o=>`<div class="entry"><b>${escape(o.title)}</b><p class="muted">${escape(o.material)} · bloco ${escape(o.block)||'—'} · ${o.price?'USD '+escape(o.price)+'/ft²':'Preço a consultar'}</p></div>`).join('')}</section>`;if(tab==='campaigns')h=`<section class="panel"><h2>Nova campanha</h2><form id="addCampaign"><label>Nome<input name="name" required></label><label>Oferta<select name="offer" required>${offers.map(o=>`<option value="${o.id}">${escape(o.title)}</option>`).join('')}</select></label><h3>Destinatários autorizados</h3>${contacts.filter(c=>c.consent).map(c=>`<label><input class="check" type="checkbox" name="contact" value="${c.id}"> ${escape(c.name)} (${c.language})</label>`).join('')||'<p class="muted">Cadastre primeiro um contato autorizado.</p>'}<button class="primary">Criar campanha</button></form></section><section class="panel"><h2>Campanhas</h2>${campaigns.map(c=>`<div class="entry"><b>${escape(c.name)}</b> · ${c.items.length} destinatários <p>${btn('Abrir fila','queue:'+c.id)}</p></div>`).join('')||'Nenhuma campanha ainda.'}</section>`;if(tab==='queue'){const campaign=campaigns.find(c=>c.id===campaignId)||campaigns[0],o=offers.find(x=>x.id===campaign?.offer);h=`<section class="panel"><h2>Fila de WhatsApp</h2>${campaign?`<p>${escape(campaign.name)} · ${escape(o?.title)}</p>${campaign.items.map(item=>{const c=contacts.find(x=>x.id===item.contact);return `<div class="entry"><b>${escape(c.name)}</b> <span class="tag">${escape(item.status)}</span><p class="muted">${escape(c.phone)} · ${c.language}</p><div class="actions">${btn('Prévia','preview:'+item.id)}${btn('Abrir WhatsApp','open:'+item.id,!c.phone)}${btn('Confirmar manualmente','confirm:'+item.id)}${btn('Pular','skip:'+item.id)}</div></div>`}).join('')}`:'Crie uma campanha para começar.'}</section><section id="preview"></section>`} $('content').innerHTML=h}
function message(c,o){const intro=c.language==='ES'?`¡Hola, ${c.name}! Espero que estés muy bien.\n\nQuisiera compartir contigo ${o.material}${o.block?' · bloque '+o.block:''}, de Polita.`:c.language==='EN'?`Hello ${c.name}! I hope you're doing well.\n\nI'd like to share ${o.material}${o.block?' · block '+o.block:''}, from Polita.`:`Olá, ${c.name}! Tudo bem?\n\nGostaria de compartilhar ${o.material}${o.block?' · bloco '+o.block:''}, da Polita.`;return intro+(o.price?`\n\nUSD ${o.price}/ft²`:'')+(o.url?`\n\n${o.url}`:'')+(c.language==='ES'?'\n\n¿Te gustaría recibir más información?':c.language==='EN'?'\n\nWould you like more information?':'\n\nGostaria de mais informações?')}
document.addEventListener('submit',e=>{const f=e.target;if(!['addContact','addOffer','addCampaign'].includes(f.id))return;e.preventDefault();const d=new FormData(f);if(f.id==='addContact'){const phone=String(d.get('phone')).replace(/\D/g,'');if(!/^\d{10,15}$/.test(phone))return notice('Informe número com DDI, entre 10 e 15 dígitos.');contacts.push({id:next++,name:String(d.get('name')).trim(),company:String(d.get('company')).trim(),phone,language:d.get('language'),consent:d.has('consent')});notice('Contato adicionado ao teste.')}if(f.id==='addOffer'){offers.push({id:next++,title:d.get('title'),material:d.get('material'),block:d.get('block'),price:d.get('price'),url:d.get('url')});notice('Oferta de teste salva.')}if(f.id==='addCampaign'){const ids=d.getAll('contact').map(Number);if(!ids.length)return notice('Selecione pelo menos um comprador autorizado.');const c={id:next++,name:d.get('name'),offer:Number(d.get('offer')),items:ids.map(contact=>({id:next++,contact,status:'Pendente'}))};campaigns.push(c);campaignId=c.id;tab='queue';notice('Campanha criada. Nenhuma mensagem foi enviada.')}render()});document.addEventListener('click',e=>{const el=e.target.closest('[data-tab],[data-action]');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render();return}const [act,id]=el.dataset.action.split(':');if(act==='queue'){campaignId=Number(id);tab='queue';render();return}const camp=campaigns.find(c=>c.id===campaignId)||campaigns[0],item=camp?.items.find(x=>x.id===Number(id)),c=contacts.find(x=>x.id===item?.contact),o=offers.find(x=>x.id===camp?.offer);if(!item||!c||!o)return;if(act==='preview'){$('preview').innerHTML='<h2>Prévia</h2><pre>'+escape(message(c,o))+'</pre>';return}if(act==='open'){if(!c.consent||!c.phone)return notice('É necessário telefone e consentimento.');const win=window.open('https://wa.me/'+c.phone+'?text='+encodeURIComponent(message(c,o)),'_blank','noopener,noreferrer');item.status='Aberto (não enviado)';notice('WhatsApp solicitado. Confirme o envio no aplicativo; se não abriu, verifique bloqueio de pop-ups.');render();return}if(act==='confirm')item.status='Confirmado manualmente';if(act==='skip')item.status='Pulado';render()});render()})();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
